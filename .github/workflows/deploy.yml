name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Tests run on PRs too; the Pages steps below are skipped for them.
  pull_request:
  workflow_dispatch:

# GITHUB_TOKEN permissions needed to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; queue rather than cancel so a run in progress finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The runner's clock is UTC, so this covers the UTC case.
      - name: Test
        run: npm test

      # The DST suites in time.test.ts are `describe.runIf(TZ === ...)`, so they
      # pass vacuously under UTC. This is the only step that actually runs them.
      - name: Test across timezones
        run: npm run test:tz

      # `npm run build` also runs `tsc --noEmit`, so this typechecks too.
      # Project Pages sites are served from /<repo>/, so the app is built
      # against that base. Change to "/" if a custom domain is set up.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
